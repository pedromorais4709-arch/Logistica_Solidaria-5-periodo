<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Logística Solidária</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/login.css}">
  <link rel="stylesheet" th:href="@{/css/responsivo.css}">
</head>
<body class="auth-body">
  <main class="auth-layout">
    <section class="auth-brand">
      <a class="logo" th:href="@{/}"><span class="logo-mark">♥</span> Logística <strong>Solidária</strong></a>
      <div><span class="eyebrow">Bem-vindo de volta</span><h1>Juntos, podemos fazer a diferença.</h1><p>Acesse sua conta para acompanhar doações, pedidos e entregas.</p></div>
      <div class="auth-decoration">🤝　📦　❤️</div>
    </section>
    <section class="auth-card-wrap">
      <form class="auth-card" id="loginForm" novalidate>
        <a class="back-link" th:href="@{/}">← Voltar para o início</a>
        <h2>Entrar</h2><p class="form-intro">Acesse sua conta do Logística Solidária.</p>
        <div class="form-message" id="loginMessage"></div>
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seu@email.com" autocomplete="email">
        <small class="field-error" id="emailError"></small>
        <label for="senha">Senha</label>
        <div class="password-wrap"><input id="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password"><button type="button" class="password-toggle" data-target="senha">👁</button></div>
        <small class="field-error" id="senhaError"></small>
        <div class="form-row-between"><label class="check"><input type="checkbox"> Lembrar de mim</label><a href="#" id="forgotPassword">Esqueci minha senha</a></div>
        <button class="btn btn-primary btn-full" type="submit">Entrar</button>
        <p class="auth-footer">Ainda não possui uma conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
      </form>
    </section>
  </main>
  <script th:src="@{/js/login.js}"></script>
  <script th:src="@{/js/script.js}"></script>
</body>
</html>
